[package]
name = "starcoin-pipeline-timing"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pipeline timing collector for benchmarking starcoin transaction processing"

[dependencies]
starcoin-crypto = { workspace = true }
once_cell = "1.18"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
