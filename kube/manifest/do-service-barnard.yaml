apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scheme: 'http'
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9101'
    prometheus.io/path: '/metrics'
    service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-algorithm: "round_robin"
  name: starcoin-svc
  namespace: starcoin-barnard
spec:
  selector:
    app: starcoin
    network: barnard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9850
      name: http-rpc-80
    - protocol: TCP
      port: 9840
      targetPort: 9840
      name: node
    - protocol: TCP
      port: 9850
      targetPort: 9850
      name: http-rpc
    - protocol: TCP
      port: 9860
      targetPort: 9860
      name: tcp-rpc
    - protocol: TCP
      port: 9870
      targetPort: 9870
      name: ws-rpc
    - port: 9101
      name: metrics
      protocol: TCP
      targetPort: 9101
    - port: 9880
      name: stratum
      protocol: TCP
      targetPort: 9880
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: "9840"
  labels:
    app: starcoin
    network: barnard
    statefulset.kubernetes.io/pod-name: starcoin-0
  name: starcoin-0
  namespace: starcoin-barnard
spec:
  ports:
    - port: 9840
      name: node
      protocol: TCP
      targetPort: 9840
    - port: 9850
      name: http-rpc
      protocol: TCP
      targetPort: 9850
    - port: 9860
      name: tcp-rpc
      protocol: TCP
      targetPort: 9860
    - port: 9870
      name: ws-rpc
      protocol: TCP
      targetPort: 9870
    - port: 9101
      name: metrics
      protocol: TCP
      targetPort: 9101
    - port: 9880
      name: stratum
      protocol: TCP
      targetPort: 9880
  selector:
    app: starcoin
    network: barnard
    statefulset.kubernetes.io/pod-name: starcoin-0
  type: LoadBalancer
---
