apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starcoin
  namespace: starcoin-main
  labels:
    app: starcoin
    network: main
spec:
  selector:
    matchLabels:
      app: starcoin
  serviceName: starcoin-svc
  replicas: 2
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      name: starcoin
      labels:
        app: starcoin
        network: main
      annotations:
        starcoin.org/activation-height: "32165300"
        starcoin.org/image-digest: sha256:0d4638b3fdc5ee6f8c2d8db78b5d625de6757609acbe9d259c7431834c2d3470
        starcoin.org/release-commit: 4d78c07ca61bf4d9b8f06e2eb2f1a3144987bd72
        starcoin.org/release-version: v1.13.27
    spec:
      priorityClassName: starcoin-core-critical
      nodeSelector:
        starcoin/node-pool: seed-pool
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: starcoin
                network: main
            topologyKey: kubernetes.io/hostname
      containers:
      - name: starcoin
        image: ghcr.io/starcoinorg/starcoin@sha256:ee867dc1bb717746628c996b4cc293a6cf0cf98f0732bec47e425a438cd6053e
        imagePullPolicy: Always
        # With --rocksdb-max-open-files 2048 a warm seed stays under ~3 GiB
        # (SST index ~0.7 GiB, 18 memtables bounded by the 1 GiB WAL cap,
        # per-CF block caches); before that cap it grew to 6+ GiB.
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
        command:
          - bash
          - -c
        args:
          -
            # Keep ~six months of RPC logs (client IPs): the node rolls its
            # 1 GiB log about every 6.3 days on Main, so 36 gzipped backups
            # cover ~7.5 months at about 3.6 GiB per node.
            # --rocksdb-max-open-files: RocksDB keeps the index and filter
            # blocks of every open SST in memory. The default (40960) exceeds the
            # ~8k SSTs of the Main DB, so memory grew toward the 7Gi limit.
            rm -rf /sc-data/main/starcoin.ipc /sc-data/main/starcoindb/db/starcoindb/LOCK;
            id=$(echo -e $POD_NAME|awk -F'-' '{print $2}') && IFS='; ' read -r -a node_keys <<< $NODE_KEYS &&
            node_key=${node_keys[$id]};
            if [ ! -z $node_key ]; then
              node_key_flag="--node-key ${node_key}";
            fi;
            /starcoin/starcoin -n main --discover-local true --disable-miner-client true --min-peers-to-propagate 512 --max-peers-to-propagate 1024 --max-outgoing-peers 512 --max-incoming-peers 512 -d /sc-data --logger-max-backup 36 --rocksdb-max-open-files 2048 $node_key_flag;
        ports:
          - containerPort: 9840
            hostPort: 9840
        volumeMounts:
        - name: starcoin-volume
          mountPath: /sc-data
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: NODE_KEYS
            valueFrom:
              secretKeyRef:
                name: node-keys
                key: node-keys
        livenessProbe:
          tcpSocket:
            port: 9840
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 4
          successThreshold: 1
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - >-
                 /starcoin/starcoin -n main -d /sc-data node sync status|grep Synchronized
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
  volumeClaimTemplates:
  - metadata:
      name: starcoin-volume
      namespace: starcoin-main
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: do-block-storage
      dataSource:
        apiGroup: snapshot.storage.k8s.io
        kind: VolumeSnapshot
        name: migration-seed-do-snapshot
      resources:
        requests:
          storage: 500Gi
