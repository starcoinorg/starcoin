apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starcoin
  namespace: starcoin-main
  labels:
    app: starcoin
    network: main
spec:
  selector:
    matchLabels:
      app: starcoin
  serviceName: starcoin-svc
  replicas: 7
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      name: starcoin
      labels:
        app: starcoin
        network: main
      annotations:
        starcoin.org/activation-height: "32165300"
        starcoin.org/image-digest: sha256:8d4f8e9c68b8111faaa3736039cb65aafeab147f4191033737028ea430283b10
        starcoin.org/release-commit: 7c424e76af56efdbac669934dc21891f60d544eb
        starcoin.org/release-version: v1.13.22
    spec:
      priorityClassName: starcoin-core-critical
      nodeSelector:
        starcoin/node-pool: seed-pool
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: starcoin
                  network: main
              topologyKey: kubernetes.io/hostname
      containers:
      - name: starcoin
        image: ghcr.io/starcoinorg/starcoin@sha256:8d4f8e9c68b8111faaa3736039cb65aafeab147f4191033737028ea430283b10
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 1536Mi
        command:
          - bash
          - -c
        args:
          -
            rm -rf /sc-data/main/starcoin.ipc /sc-data/main/starcoindb/db/starcoindb/LOCK;
            id=$(echo -e $POD_NAME|awk -F'-' '{print $2}') && IFS='; ' read -r -a node_keys <<< $NODE_KEYS &&
            node_key=${node_keys[$id]};
            if [ ! -z $node_key ]; then
              node_key_flag="--node-key ${node_key}";
            fi;
            /starcoin/starcoin -n main --discover-local true --disable-miner-client true --min-peers-to-propagate 512 --max-peers-to-propagate 1024 --max-outgoing-peers 512 --max-incoming-peers 512 -d /sc-data $node_key_flag;
        ports:
          - containerPort: 9840
            hostPort: 9840
        volumeMounts:
        - name: starcoin-volume
          mountPath: /sc-data
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: NODE_KEYS
            valueFrom:
              secretKeyRef:
                name: node-keys
                key: node-keys
        livenessProbe:
          tcpSocket:
            port: 9840
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 4
          successThreshold: 1
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - >-
                 /starcoin/starcoin -n main -d /sc-data node sync status|grep Synchronized
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
  volumeClaimTemplates:
  - metadata:
      name: starcoin-volume
      namespace: starcoin-main
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: do-block-storage
      dataSource:
        apiGroup: snapshot.storage.k8s.io
        kind: VolumeSnapshot
        name: migration-seed-do-snapshot
      resources:
        requests:
          storage: 500Gi
