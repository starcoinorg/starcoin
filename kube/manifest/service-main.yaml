    - port: 9870
      name: ws-rpc
      protocol: TCP
      targetPort: 9870
    - port: 9101
      name: metrics
      protocol: TCP
      targetPort: 9101
  selector:
    app: starcoin
    network: main
    statefulset.kubernetes.io/pod-name: starcoin-0
  type: LoadBalancer
