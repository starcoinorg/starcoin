apiVersion: v1
kind: Service
metadata:
  name: starcoin-main-block-permit-signer
  namespace: starcoin-main
  labels:
    app.kubernetes.io/name: starcoin
    starcoin.org/role: block-permit-signer
spec:
  selector:
    app: starcoin-main-block-permit-signer
    statefulset.kubernetes.io/pod-name: starcoin-main-block-permit-signer-0
  ports:
    - name: p2p
      port: 9840
      targetPort: 9840
    - name: http-rpc
      port: 9850
      targetPort: 9850
    - name: ws-rpc
      port: 9870
      targetPort: 9870
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starcoin-main-block-permit-signer
  namespace: starcoin-main
  labels:
    app: starcoin-main-block-permit-signer
    network: main
    starcoin.org/role: block-permit-signer
spec:
  replicas: 1
  serviceName: starcoin-main-block-permit-signer
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: starcoin-main-block-permit-signer
  template:
    metadata:
      labels:
        app: starcoin-main-block-permit-signer
        network: main
        starcoin.org/role: block-permit-signer
      annotations:
        starcoin.org/activation-height: "32165300"
        starcoin.org/image-digest: sha256:0d4638b3fdc5ee6f8c2d8db78b5d625de6757609acbe9d259c7431834c2d3470
        starcoin.org/mining-upstream: single-endpoint
        starcoin.org/release-commit: 4d78c07ca61bf4d9b8f06e2eb2f1a3144987bd72
        starcoin.org/release-version: v1.13.27
    spec:
      priorityClassName: starcoin-core-critical
      terminationGracePeriodSeconds: 60
      # Block production (this signer and the mining pool's stratumd) runs on the
      # dedicated block-production node pool. Its label and NoSchedule taint
      # starcoin.org/dedicated=block-production are set on the pool, so nodes
      # recycled by an upgrade or a repair keep them. seed-pool is the fallback
      # when that node is unavailable; the memory request reserves real room there.
      tolerations:
        - key: starcoin.org/dedicated
          operator: Equal
          value: block-production
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: starcoin/node-pool
                    operator: In
                    values: [block-production, seed-pool]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: starcoin/node-pool
                    operator: In
                    values: [block-production]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: starcoin
                  network: main
              topologyKey: kubernetes.io/hostname
      containers:
        - name: starcoin
          image: ghcr.io/starcoinorg/starcoin@sha256:0d4638b3fdc5ee6f8c2d8db78b5d625de6757609acbe9d259c7431834c2d3470
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
          args:
            - |
              if [ "${POD_NAME}" != "starcoin-main-block-permit-signer-0" ]; then
                echo "refusing to start a second keyed block-permit signer: ${POD_NAME}" >&2
                exit 64
              fi
              rm -f /sc-data/main/starcoin.ipc \
                /sc-data/main/starcoindb/db/starcoindb/LOCK \
                /sc-data/main/network_key
              exec /starcoin/starcoin \
                -n main \
                --discover-local true \
                --disable-miner-client true \
                --block-permit-private-key-file /run/secrets/starcoin/block-permit/private-key \
                -d /sc-data
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: p2p
              containerPort: 9840
            - name: http-rpc
              containerPort: 9850
            - name: ws-rpc
              containerPort: 9870
          # Observed 3.4-5.0 GiB resident. The limits of every pod on the
          # block-production node add up to less than its allocatable memory.
          resources:
            requests:
              cpu: 500m
              memory: 5Gi
            limits:
              memory: 7Gi
          livenessProbe:
            tcpSocket:
              port: 9840
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /starcoin/starcoin -n main -d /sc-data node sync status | grep Synchronized
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: starcoin-data
              mountPath: /sc-data
            - name: block-permit-signer
              mountPath: /run/secrets/starcoin/block-permit
              readOnly: true
      volumes:
        - name: starcoin-data
          persistentVolumeClaim:
            claimName: starcoin-main-block-permit-signer-g1
        - name: block-permit-signer
          secret:
            secretName: block-permit-signer-g1
            defaultMode: 0400
