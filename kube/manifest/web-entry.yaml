# One public HTTP entry for the Starcoin web services. Cloudflare proxies every
# hostname below to this single load balancer; nginx routes by Host header to the
# in-cluster Service. Replaces one DigitalOcean load balancer per service.
apiVersion: v1
kind: Namespace
metadata:
  name: web-entry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-entry-nginx
  namespace: web-entry
data:
  default.conf: |
    # kube-dns; resolve upstreams per request so a recreated Service is picked up.
    resolver 10.245.0.10 valid=30s ipv6=off;

    map $host $upstream {
      hostnames;
      default                 "";
      poll-api.starcoin.org   poll-api.starcoin-main.svc.cluster.local;
      main-pool.starcoin.org  starcoin-pool-service-svc.starcoin-main.svc.cluster.local;
      swap-api.starcoin.org   starswap-api.starcoin-main.svc.cluster.local;
      swap-api.starswap.xyz   starswap-api.starcoin-main.svc.cluster.local;
      info-api.starswap.xyz   swap-stat-api.starcoin-main.svc.cluster.local;
      stcscan.io              starcoin-explorer-service.starcoin-client.svc.cluster.local;
      api.stcscan.io          scan-api.starcoin-api.svc.cluster.local;
      doapi.stcscan.io        scan-api.starcoin-api.svc.cluster.local;
      bridge-node0.starswap.xyz            starcoin-bridge-main-main-service-0.starcoin-native-bridge.svc.cluster.local;
      bridge-node1.starswap.xyz            starcoin-bridge-main-main-service-1.starcoin-native-bridge.svc.cluster.local;
      bridge-node2.starswap.xyz            starcoin-bridge-main-main-service-2.starcoin-native-bridge.svc.cluster.local;
      bridge-indexer-monitor.starswap.xyz  bridge-indexer-main-main.starcoin-native-bridge.svc.cluster.local;
    }

    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      close;
    }

    server {
      listen 8080 default_server;
      server_name _;
      client_max_body_size 10m;

      location = /__web-entry-health {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        if ($upstream = "") {
          return 404;
        }
        proxy_pass http://$upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-entry
  namespace: web-entry
  labels:
    app: web-entry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-entry
  template:
    metadata:
      labels:
        app: web-entry
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: web-entry
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        starcoin/node-pool: seed-pool
      containers:
        - name: nginx
          # nginxinc/nginx-unprivileged:1.27-alpine, pinned by index digest
          image: docker.io/nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /__web-entry-health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /__web-entry-health
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: web-entry-nginx
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-entry
  namespace: web-entry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-entry
---
apiVersion: v1
kind: Service
metadata:
  name: web-entry
  namespace: web-entry
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: tcp
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: "8080"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: http
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: /__web-entry-health
spec:
  type: LoadBalancer
  selector:
    app: web-entry
  ports:
    - name: http
      port: 80
      targetPort: 8080
