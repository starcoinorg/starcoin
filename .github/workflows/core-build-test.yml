name: Core Build and Test

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner to use'
        required: false
        default: 'self-hosted'
        type: string

jobs:
  build-and-test:
    name: build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Create check run
        uses: actions/github-script@v6
        id: check
        with:
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Build and Test',
              head_sha: context.sha,
              status: 'in_progress',
              started_at: new Date().toISOString()
            });
            return check.id

      - name: Set check ID
        run: echo "CHECK_ID=${{ steps.check.outputs.result }}" >> $GITHUB_ENV
      - name: checkout
        uses: actions/checkout@v1
        with:
          submodules: recursive
      - name: run fmt check
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: -- --check
      - name: setup environment
        run: bash ./scripts/dev_setup.sh  -b -t -y -m
      - name: run cargo clean
        uses: actions-rs/cargo@v1
        with:
          command: clean
      - name: run cargo check
        uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: -D warnings
        with:
          command: clippy
          args: --all-targets

      - name: build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all
      - name: test
        run: ./scripts/nextest.sh
      - name: Doc Tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --doc
      - name: integration test dev environment
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full
          STARCOIN_WS: ${{ secrets.STARCOIN_WS }}
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --test integration -- -e cmd

      - name: Update check success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: process.env.CHECK_ID,
              status: 'completed',
              conclusion: 'success',
              completed_at: new Date().toISOString()
            });

      - name: Update check failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: process.env.CHECK_ID,
              status: 'completed',
              conclusion: 'failure',
              completed_at: new Date().toISOString()
            });
