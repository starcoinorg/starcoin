name: Update Networks Submodule

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: dual-verse-dag

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust (reads rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: run cargo clean
        uses: actions-rs/cargo@v1
        with:
          command: clean

      - name: Update networks submodule
        id: sync
        run: |
          set -eo pipefail
          git submodule update --init --remote networks
          networks_commit=$(git -C networks rev-parse HEAD)
          echo "networks_commit=$networks_commit" >> "$GITHUB_OUTPUT"

      - name: Generate stdlib and genesis
        run: |
          cargo run -p stdlib
          cargo run -p starcoin-genesis

      - name: Check for networks updates
        id: check
        run: |
          if git diff --quiet HEAD -- networks; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dual-verse-dag
          branch: chore/update-networks-${{ steps.sync.outputs.networks_commit }}
          title: "chore: update networks submodule (${{ steps.sync.outputs.networks_commit }})"
          commit-message: "chore: update networks submodule (${{ steps.sync.outputs.networks_commit }})"
          body: |
            - Update networks submodule to `${{ steps.sync.outputs.networks_commit }}`
            - Rebuild stdlib and genesis
          delete-branch: true
