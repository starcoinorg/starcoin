name: Build and Test

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "self-hosted runner unique label (e.g. nixos-amd or k8s)"
        required: true
        type: string

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - dual-verse-dag

  merge_group:
    branches:
      - dual-verse-dag

jobs:
  choose-runner:
    if: ${{ (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'ci-runner:')) || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.runner_label != '') }}
    runs-on: ubuntu-latest
    outputs:
      runs_on_json: ${{ steps.pick.outputs.runs_on_json }}
    steps:
      - name: Pick runner from PR label.
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          INPUT_LABEL: ${{ inputs.runner_label }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          TOKEN: ${{ github.token }}
          DEFAULT_CI_RUNNER_LABEL: ${{ vars.DEFAULT_CI_RUNNER_LABEL }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            target=$(printf '%s' "$LABELS_JSON" \
              | jq -r '.[]?.name
                        | select(startswith("ci-runner:"))
                        | sub("^ci-runner:\\s*"; "")' \
              | head -n1)
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            pr_number=$(printf '%s\n' "$REF_NAME" | sed -n 's#.*/pr-\([0-9][0-9]*\)-.*#\1#p' | head -n1)
            if [ -z "${pr_number:-}" ]; then
              echo "Cannot parse PR number from merge queue ref: $REF_NAME" >&2
              exit 1
            fi

            labels_json=$(curl -fsSL --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPOSITORY/issues/$pr_number/labels")
            target=$(printf '%s' "$labels_json" \
              | jq -r '.[]?.name
                        | select(startswith("ci-runner:"))
                        | sub("^ci-runner:\\s*"; "")' \
              | head -n1)

            if [ -z "${target:-}" ] || [ "$target" = "null" ]; then
              target="${DEFAULT_CI_RUNNER_LABEL:-}"
            fi
          else
            target="$INPUT_LABEL"
          fi

          if [ -z "${target:-}" ] || [ "$target" = "null" ]; then
            echo "No runner label found. Expected ci-runner:* on PR or vars.DEFAULT_CI_RUNNER_LABEL." >&2
            exit 1
          fi

          printf 'runs_on_json=%s\n' "$(jq -cn --arg t "$target" '["self-hosted", $t]')" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: build and test
    needs: choose-runner
    if: ${{ (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'ci-runner:')) || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.runner_label != '') }}
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on_json) }}
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust (reads rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: run fmt check
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: -- --check
      - name: setup environment
        run: bash ./scripts/dev_setup.sh -b -t -m
      - name: run cargo clean
        uses: actions-rs/cargo@v1
        with:
          command: clean
      - name: run cargo check
        uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: -D warnings
        with:
          command: clippy
          args: --all-targets

      - name: build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all
          
      - name: Cargo Next Test
        run: ./scripts/nextest.sh
        
      - name: Move Package Manager Test
        run: ./scripts/move_test.sh
        
      - name: Doc Tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --doc

      - name: integration test dev environment
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full
          STARCOIN_WS: ${{ secrets.STARCOIN_WS }}
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --test integration -- -e cmd
