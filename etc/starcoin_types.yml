---
AccountAddress:
  NEWTYPESTRUCT:
    TUPLEARRAY:
      CONTENT: U8
      SIZE: 16
BalanceResource:
  STRUCT:
    - token: U128
ChainId:
  STRUCT:
    - id: U8
EventKey:
  NEWTYPESTRUCT: BYTES
HashValue:
  NEWTYPESTRUCT: BYTES
Identifier:
  NEWTYPESTRUCT: STR
Module:
  STRUCT:
    - code: BYTES
ModuleId:
  STRUCT:
    - address:
        TYPENAME: AccountAddress
    - name:
        TYPENAME: Identifier
TransactionArgument:
  ENUM:
    0:
      U8:
        NEWTYPE: U8
    1:
      U64:
        NEWTYPE: U64
    2:
      U128:
        NEWTYPE: U128
    3:
      Address:
        NEWTYPE:
          TYPENAME: AccountAddress
    4:
      U8Vector:
        NEWTYPE: BYTES
    5:
      Bool:
        NEWTYPE: BOOL
    6:
      U16:
        NEWTYPE: U16
    7:
      U32:
        NEWTYPE: U32
    8:
      U256:
        NEWTYPE:
          TUPLEARRAY:
            CONTENT: U8
            SIZE: 32
WriteOp:
  ENUM:
    0:
      Deletion: UNIT
    1:
      Value:
        NEWTYPE: BYTES
