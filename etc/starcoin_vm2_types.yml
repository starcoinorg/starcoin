---
AccountAddress:
  NEWTYPESTRUCT:
    TUPLEARRAY:
      CONTENT: U8
      SIZE: 16
ChainId:
  STRUCT:
    - id: U8
EntryFunction:
  STRUCT:
    - module:
        TYPENAME: ModuleId
    - function:
        TYPENAME: Identifier
    - ty_args:
        SEQ:
          TYPENAME: TypeTag
    - args:
        SEQ: BYTES
EventKey:
  STRUCT:
    - creation_number: U64
    - account_address:
        TYPENAME: AccountAddress
HashValue:
  NEWTYPESTRUCT: BYTES
Identifier:
  NEWTYPESTRUCT: STR
Module:
  STRUCT:
    - code: BYTES
ModuleId:
  STRUCT:
    - address:
        TYPENAME: AccountAddress
    - name:
        TYPENAME: Identifier
Package:
  STRUCT:
    - package_address:
        TYPENAME: AccountAddress
    - modules:
        SEQ:
          TYPENAME: Module
    - init_script:
        OPTION:
          TYPENAME: EntryFunction
Script:
  STRUCT:
    - code: BYTES
    - ty_args:
        SEQ:
          TYPENAME: TypeTag
    - args:
        SEQ:
          TYPENAME: TransactionArgument
StateValueMetadata:
  ENUM:
    0:
      V0:
        STRUCT:
          - deposit: U64
          - creation_time_usecs: U64
    1:
      V1:
        STRUCT:
          - slot_deposit: U64
          - bytes_deposit: U64
          - creation_time_usecs: U64
StructTag:
  STRUCT:
    - address:
        TYPENAME: AccountAddress
    - module:
        TYPENAME: Identifier
    - name:
        TYPENAME: Identifier
    - type_args:
        SEQ:
          TYPENAME: TypeTag
TransactionArgument:
  ENUM:
    0:
      U8:
        NEWTYPE: U8
    1:
      U64:
        NEWTYPE: U64
    2:
      U128:
        NEWTYPE: U128
    3:
      Address:
        NEWTYPE:
          TYPENAME: AccountAddress
    4:
      U8Vector:
        NEWTYPE: BYTES
    5:
      Bool:
        NEWTYPE: BOOL
    6:
      U16:
        NEWTYPE: U16
    7:
      U32:
        NEWTYPE: U32
    8:
      U256:
        NEWTYPE:
          TUPLEARRAY:
            CONTENT: U8
            SIZE: 32
TransactionPayload:
  ENUM:
    0:
      Script:
        NEWTYPE:
          TYPENAME: Script
    1:
      Package:
        NEWTYPE:
          TYPENAME: Package
    2:
      EntryFunction:
        NEWTYPE:
          TYPENAME: EntryFunction
TypeTag:
  ENUM:
    0:
      Bool: UNIT
    1:
      U8: UNIT
    2:
      U64: UNIT
    3:
      U128: UNIT
    4:
      Address: UNIT
    5:
      Signer: UNIT
    6:
      Vector:
        NEWTYPE:
          TYPENAME: TypeTag
    7:
      Struct:
        NEWTYPE:
          TYPENAME: StructTag
    8:
      U16: UNIT
    9:
      U32: UNIT
    10:
      U256: UNIT
WriteOp:
  ENUM:
    0:
      Creation:
        NEWTYPE: BYTES
    1:
      Modification:
        NEWTYPE: BYTES
    2:
      Deletion: UNIT
    3:
      CreationWithMetadata:
        STRUCT:
          - data: BYTES
          - metadata:
              TYPENAME: StateValueMetadata
    4:
      ModificationWithMetadata:
        STRUCT:
          - data: BYTES
          - metadata:
              TYPENAME: StateValueMetadata
    5:
      DeletionWithMetadata:
        STRUCT:
          - metadata:
              TYPENAME: StateValueMetadata
