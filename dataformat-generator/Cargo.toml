# Starcoin VM1 Data Format Generator
#
# This crate generates VM1-only YAML schema files for cross-language SDK generation.
# It uses starcoin-vm-types directly (pure VM1) to avoid TypeTag conflicts with VM2.
#
# Generated files:
# - etc/starcoin_types.yml      - VM1 types schema
# - etc/onchain_events.yml      - On-chain event types

[build-dependencies]
serde-reflection = { workspace = true }
serde_yaml = { workspace = true }
# Pure VM1 types only - no VM2 dependencies
starcoin-vm-types = { workspace = true }
starcoin-crypto = { workspace = true }

[dependencies]

[package]
authors = { workspace = true }
edition = { workspace = true }
name = "starcoin-dataformat-generator"
version = { workspace = true }
build = "build.rs"
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
